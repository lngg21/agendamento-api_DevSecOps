name: Continuous Integration & Security Gates

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  # ETAPA 1: Proteção de Segredos - bloqueia tudo se houver segredo exposto
  secret-scan:
    name: "Gitleaks - Secret Scanning"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Se um segredo for encontrado, o job falha e interrompe a esteira

  # ETAPA 2: Lint & Testes Unitários - só roda se não houver segredos expostos
  test-and-lint:
    name: "Lint & Unit Tests"
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test --if-present

  # ETAPA 3: SAST - só roda se lint/testes passarem
  sast-scan:
    name: "Semgrep - Static Application Security Testing"
    runs-on: ubuntu-latest
    needs: test-and-lint
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          python3 -m pip install semgrep
          semgrep scan --config=auto --error --severity=ERROR

  # ETAPA 4 (paralela): Validação Terraform - independente do código da app
  terraform-lint:
    name: "Terraform fmt & validate"
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  # ETAPA 5 (paralela à terraform-lint): Checkov - scan de IaC
  iac-scan:
    name: "Checkov - Infrastructure as Code Scanning"
    runs-on: ubuntu-latest
    needs: terraform-lint
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          file: main.tf
          framework: terraform
          soft_fail: false
          output_format: cli

  # ETAPA 6: Build & Scan da Imagem - só roda se TUDO acima passar
  docker-build-and-scan:
    name: "Docker Build, Trivy Scan & Push"
    runs-on: ubuntu-latest
    needs: [sast-scan, iac-scan]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t my-app:${{ github.sha }} .

      - name: Trivy Image Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'my-app:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
        # Se houver vulnerabilidade crítica, o job falha e a imagem não é publicada

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image to Registry
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag my-app:${{ github.sha }} ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
        # Push só ocorre em main e após Trivy aprovar (needs implícito pela ordem do job)